<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1623" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Navigacija biciklom po Zagrebu: Bajs, javna parkirališta i biciklističke staze." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NavBajs" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://valhalla1.openstreetmap.de" />
    <link rel="preconnect" href="https://routing.openstreetmap.de" />
    <link rel="dns-prefetch" href="https://photon.komoot.io" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,560&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>NavBajs — navigacija biciklom po Zagrebu</title>
    <script>
      try {
        var stored = localStorage.getItem("bikebr-theme")
        var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches
        if (dark) document.documentElement.classList.add("dark")
        var themeColor = dark ? "#0F1623" : "#F3F5F8"
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          meta.setAttribute("content", themeColor)
        })
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
